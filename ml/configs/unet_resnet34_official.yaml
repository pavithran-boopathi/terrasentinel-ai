# Phase 4: ImageNet-pretrained unet_resnet34 on official; same data, crops, loss, schedule and early stopping as Phase 3.
name: unet-resnet34-official
arch: unet_resnet34
pretrained: true
split_scheme: official
eval_splits: [test, bolivia]
dropout: 0.1
epochs: 80
batch_size: 8
lr: 0.0003
crop: 256
patience: 15
