name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[api,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=backend --cov-report=term-missing

  backend-postgres:
    # Migrations must also apply on real PostgreSQL + PostGIS.
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ts
          POSTGRES_PASSWORD: ts
          POSTGRES_DB: ts
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ts" --health-interval 5s --health-retries 10
    env:
      TS_DATABASE_URL: postgresql+psycopg://ts:ts@localhost:5432/ts
      TS_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[api]"
      - run: alembic upgrade head && alembic downgrade base && alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
