[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terrasentinel"
version = "0.1.0"
description = "TerraSentinel AI — satellite-powered disaster intelligence platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "structlog>=24.4",
]

[project.optional-dependencies]
# FastAPI service, DB and background workers.
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36,<2.2",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "geoalchemy2>=0.16,<1",
  "celery[redis]>=5.4,<6",
  "redis>=5.2",
  "pyjwt>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.18",
  "email-validator>=2.2",
]
# Deep learning stack. MPS-capable wheels on Apple Silicon; no CUDA-only deps.
ml = [
  "torch>=2.5",
  "torchvision>=0.20",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "albumentations>=2.0,<2.1",  # 2.0.x is the last MIT-licensed line
  "mlflow>=2.18",
  "pyyaml>=6.0",
]
# Phase 4+: pretrained transformers / TorchGeo models.
ml-research = [
  "transformers>=4.46",
  "torchgeo>=0.6",
]
# Geospatial stack (rasterio/GDAL wheels bundle GDAL; no system GDAL needed).
geo = [
  "rasterio>=1.4",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.7",
  "numpy>=1.26",
  "pystac-client>=0.8",
  "matplotlib>=3.9",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["backend*", "ml*", "geospatial*"]

[tool.setuptools.package-data]
backend = ["db/alembic.ini", "db/migrations/*.py", "db/migrations/*.mako", "db/migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"scripts/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
packages = ["backend"]
